# Recurring Solid Queue tasks.
#
# GOTCHA: Solid Queue's `config_from` silently loads NOTHING when the current
# environment has no top-level key here. So every environment gets an explicit
# key (via the anchor below) — otherwise enabling the scheduler in, say,
# development would silently run no recurring jobs and the omission is invisible.
#
# The hourly prune is MANDATORY: `solid_queue_jobs` accumulates finished rows
# forever without it, and the table is on the same SQLite database as the queue.

production: &recurring
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  geneva_drive_housekeeping:
    class: "GenevaDrive::HousekeepingJob"
    schedule: "*/30 * * * *"

  # X recent search polling (U8). Each poll stops before the source's monthly spend limit.
  x_poll:
    class: "XPollJob"
    schedule: "*/15 * * * *"
  # Slack daily digests (U13): posts each product's digest once its digest hour arrives.
  digest_dispatch:
    class: "DigestDispatchJob"
    schedule: "0 * * * *"
  # Overdue agent claims (U11)
  overdue_sweep:
    class: "OverdueSweepJob"
    schedule: every 5 minutes

  # Outbound webhooks (U17): delivery log rows older than 30 days are deleted.
  webhook_delivery_prune:
    class: "WebhookDeliveryPruneJob"
    schedule: every day at 4:20am

  # Anomaly detection (U20): trailing hourly windows every 15 minutes, calendar days once a day.
  anomaly_detection_hourly:
    class: "AnomalyDetectionJob"
    args: [ "hour" ]
    schedule: "*/15 * * * *"
  anomaly_detection_daily:
    class: "AnomalyDetectionJob"
    args: [ "day" ]
    schedule: every day at 0:10am

  # Feed search (U25): truffler's upkeep, on the default queue, never realtime.
  # Resume requeues labeling after a TypeSafe outage or a crashed worker.
  truffler_resume:
    class: "Truffler::Jobs::ResumeJob"
    queue: default
    schedule: every 5 minutes
  truffler_prune_query_misses:
    class: "Truffler::Jobs::PruneQueryMissesJob"
    queue: default
    schedule: every day at 3:10am
  truffler_expire_lenses:
    class: "Truffler::Jobs::ExpireLensesJob"
    queue: default
    schedule: every day at 3:20am

development:
  <<: *recurring

test:
  <<: *recurring
