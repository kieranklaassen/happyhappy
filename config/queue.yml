default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  # Live messages get their own pool, so a burst, a backfill, a slow webhook
  # endpoint, or a long recurring job never makes them wait for a thread. The
  # default of 12 threads keeps about 20 TypeSafe calls a second in flight
  # (Jev answers in 300 to 900 ms), which is the 1,200 requests a minute limit
  # that Classification::RateLimiter enforces.
  workers:
    - queues: realtime
      threads: <%= ENV["REALTIME_JOB_THREADS"].presence || 12 %>
      processes: 1
      polling_interval: 0.05
    - queues: [ webhooks, default, solid_queue_recurring, backfill ]
      threads: <%= ENV["JOB_THREADS"].presence || 3 %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
